name: Build Android TV Launcher APK

on:
  push:
    branches: [ "main" ] # 當你提交代碼到 main 分支時觸發
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允許你在網頁上點擊手動觸發編譯

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x launcher/gradlew

    - name: Build with Gradle
      run: |
        cd launcher
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanYourTV-Custom-APK
        path: launcher/app/build/outputs/apk/debug/*.apk
